<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link rel="stylesheet" href="day-16.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>

    <!-- header -->

    <header>

        <!-- heading -->

        <div class="header-div">
            <div class="heading-card">
                <div class="heading-text">
                    <p>Student Management System</p>
                </div>
            </div>
        </div>
    </header>

    <!-- main -->

    <main>
        <div class="main-container">

            <!-- row 1 -->

            <div class="row1">

                <!-- card 1 -->

                <a href="profile/profile.html">
                    <div class="card" id="profile">
                        <div class="icon"><i class="fa-solid fa-circle-user"></i></div>
                        <div class="text">Profile</div>
                    </div>
                </a>

                <!-- card 2 -->

                <a href="courses/courses.html">
                    <div class="card" id="courses">
                        <div class="icon"><i class="fa-solid fa-book-bookmark"></i></div>
                        <div class="text">Courses</div>
                    </div>
                </a>

                <!-- card 3 -->

                <a href="schedule/schedule.html">
                    <div class="card" id="schedule">
                        <div class="icon"><i class="fa-regular fa-calendar-days"></i></div>
                        <div class="text">Schedule</div>
                    </div>
                </a>
            </div>

            <!-- row 2 -->

            <div class="row2">

                <!-- card 4 -->

                <a href="attendance/attendance.html">
                    <div class="card" id="attendance">
                        <div class="icon"><i class="fa-solid fa-clipboard-user"></i></div>
                        <div class="text">Attendance</div>
                    </div>
                </a>
                
                <!-- card 5 -->
                
                <a href="assignments/assignments.html">
                    <div class="card" id="assignments">
                        <div class="icon"><i class="fa-solid fa-file-pen"></i></div>
                        <div class="text">Assignments</div>
                    </div>
                </a>

                <!-- card 6 -->

                <a href="#">
                    <div class="card" id="grades-results">
                        <div class="icon"><i class="fa-solid fa-chart-line"></i></div>
                        <div class="text">Grades & Results</div>
                    </div>
                </a>
            </div>
        </div>
    </main>

    <script src="day-16.js"></script>
</body>
</html>
