<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>100 days of javascript</title>
        <link rel="stylesheet" href="day-15.css">
    </head>
    <body>

        <header>
            <!-- heading -->

                <div class="heading">
                    <h1>Live Resume Builder</h1>
                </div>
        </header>
        <main>
            

                <div class="content">

                        <!-- inputs -->

                    <div class="form">
                        <table>
                            <tbody>
                                <tr>
                                    <td>Name:</td>
                                    <td><input type="text" placeholder="Name"></td>
                                </tr>
                                <tr>
                                    <td>Profession: </td>
                                    <td><input type="text" placeholder="Profession"></td>
                                </tr>
                                <tr>
                                    <td>College: </td>
                                    <td><input type="text" placeholder="College"></td>
                                </tr>
                                <tr>
                                    <td>Skills: </td>
                                    <td><input type="text" placeholder="Skills"></td>
                                </tr>
                                <tr>
                                    <td>Career goal: </td>
                                    <td><input type="text" placeholder="Career goal"></td>
                                </tr>
                            </tbody>
                        </table>        
                    </div>

                        <!-- generate button -->

                        <div class="generate-button">
                            <button>Generate Resume</button>
                        </div>
                    </div>


                    <!-- resume -->

                    <div class="resume"></div>
                    
                </div>

        </main>

    </body>
</html>
