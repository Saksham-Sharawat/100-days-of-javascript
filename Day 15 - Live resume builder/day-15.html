<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>100 days of javascript</title>
    <link rel="stylesheet" href="day-15.css">
</head>
<body>

    <header>
        <!-- heading -->

            <div class="heading">
                <h1>Live Resume Builder</h1>
            </div>
    </header>
    <main>
        

            <div class="content">

                    <!-- inputs -->

                <div class="form">
                        <div class="inputs">
                        <div class="label"><input type="text" class="name" placeholder="Name"></div>
                        <div class="label"><input type="text" class="profession" placeholder="Profession"></div>
                        <div class="label"><input type="text" class="college" placeholder="College"></div>
                        <div class="label"><input type="text" class="skills" placeholder="Skills"></div>
                        <div class="label"><input type="text" class="career-goal" placeholder="Career goal"></div>
                    </div>

                    <!-- generate button -->

                    <div class="generate-button">
                        <button>Generate Resume</button>
                    </div>
                </div>


                <!-- resume -->

                <div class="resume"></div>
                
            </div>

    </main>

</body>
</html>
