<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>100 days of javascript</title>
        <link rel="stylesheet" href="day-15.css">
    </head>
    <body>

        <header>
            <!-- heading -->

                <div class="heading">
                    <h1>Live Resume Builder</h1>
                </div>
        </header>
        <main>
            

                <div class="content">

                        <!-- inputs -->

                    <div class="form">
                        <table>
                            <tbody>
                                <tr>
                                    <td>Name:</td>
                                    <td><input type="text" placeholder="Name" class="name"></td>
                                </tr>
                                <tr>
                                    <td>Profession: </td>
                                    <td><input type="text" placeholder="Profession" class="profession"></td>
                                </tr>
                                <tr>
                                    <td>College: </td>
                                    <td><input type="text" placeholder="College" class="college"></td>
                                </tr>
                                <tr>
                                    <td>Skills: </td>
                                    <td><input type="text" placeholder="Skills" class="skills"></td>
                                </tr>
                                <tr>
                                    <td>Career goal: </td>
                                    <td><input type="text" placeholder="Career goal" class="career-goal"></td>
                                </tr>

                            </tbody>
                        </table>  

                        <div class="button-container">
                            <button>Generate Resume</button>
                        </div>
                        
                    </div>

                </div>

                    <!-- resume -->

                    <div class="resume-content">
                        <div class="resume">
                            <div class="resume-header">
                                <div class="title">
                                    <p>RESUME</p>
                                </div>
                            </div>
                            <div class="resume-body"></div>
                        </div>
                    </div>
                    

        </main>

        <script src="day-15.js"></script>

    </body>
</html>
