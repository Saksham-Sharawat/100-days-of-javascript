<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>100 days of javascript</title>
    <link rel="stylesheet" href="day-15.css">
</head>
<body>
    <main>
        <!-- heading -->

            <div class="heading">
                <h1>Live Resume Builder</h1>
            </div>

            <div class="content">

                    <!-- inputs -->

                <div class="inputs">
                    <input type="text" class="name" placeholder="Name">
                    <input type="text" class="profession" placeholder="Profession">
                    <input type="text" class="college" placeholder="College">
                    <input type="text" class="skills" placeholder="Skills">
                    <input type="text" class="career-goal" placeholder="Career goal">
                </div>

                <!-- generate button -->

                <div class="generate-button">
                    <button>Generate Resume</button>
                </div>


                <!-- resume -->

                <div class="resume"></div>
                
            </div>

    </main>

</body>
</html>
