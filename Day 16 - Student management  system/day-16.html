<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>100 days of javascript</title>
    <link rel="stylesheet" href="day-16.css">
</head>
<body>

    <!-- header -->

    <header>

        <!-- heading -->

        <div class="header-div">
            <div class="heading-card">
                <div class="heading-text">
                    <p>Student Management System</p>
                </div>
            </div>
        </div>
    </header>

    <!-- main -->

    <main>
        <div class="main-container">

            <!-- row 1 -->

            <div class="row1">

                <!-- card 1 -->

                <a href="#">
                    <div class="card" id="profile">
                        <div class="icon">👤</div>
                        <div class="text">Profile</div>
                    </div>
                </a>

                <!-- card 2 -->

                <a href="#">
                    <div class="card" id="courses">
                        <div class="icon">📚</div>
                        <div class="text">Courses</div>
                    </div>
                </a>

                <!-- card 3 -->

                <a href="#">
                    <div class="card" id="schedule">
                        <div class="icon">👨‍🏫</div>
                        <div class="text">Schedule</div>
                    </div>
                </a>
            </div>

            <!-- row 2 -->

            <div class="row2">

                <!-- card 4 -->

                <a href="#">
                    <div class="card" id="attendance">
                        <div class="icon">📊</div>
                        <div class="text">Attendance</div>
                    </div>
                </a>
                
                <!-- card 5 -->
                
                <a href="#">
                    <div class="card" id="assignments">
                        <div class="icon">📝</div>
                        <div class="text">Assignments</div>
                    </div>
                </a>

                <!-- card 6 -->

                <a href="#">
                    <div class="card" id="grades-&-results">
                        <div class="icon">📈</div>
                        <div class="text">Grades & Results</div>
                    </div>
                </a>
            </div>
        </div>
    </main>

    <script src="day-16.js"></script>
</body>
</html>
